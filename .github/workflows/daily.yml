name: Daily RSI-divergence scan

on:
  schedule:
    # 12:30 UTC = 18:00 IST, after the bhavcopy is published
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh F&O universe
        run: python scripts/refresh_fno.py

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data/market.db
          key: price-db-${{ github.run_id }}
          restore-keys: |
            price-db-

      - name: Backfill history on first run
        run: |
          if [ ! -f data/market.db ]; then
            echo "No cached price DB — running initial ~1yr backfill"
            python scripts/backfill.py --days 220
          fi

      - name: Run daily scan
        env:
          PROFILE: ${{ vars.PROFILE || 'tight' }}
        run: python run_daily.py

      - name: Write run summary
        run: python scripts/summarize.py >> "$GITHUB_STEP_SUMMARY"

      - name: Save price history
        uses: actions/cache/save@v4
        with:
          path: data/market.db
          key: price-db-${{ github.run_id }}

      - name: Commit signal snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/daily_signals.json config/fno_stocks.json
          git diff --cached --quiet || git commit -m "chore: daily signals $(date -u +%F)"
          git push
