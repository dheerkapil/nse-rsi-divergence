name: Daily RSI-divergence scan

on:
  schedule:
    # Backup trigger: every 30 min from ~17:30 IST to midnight. GitHub's own
    # scheduler is unreliable, so the primary trigger is an external cron that
    # dispatches this workflow at 19:00 IST (the run then waits for the bhavcopy).
    - cron: "0,30 12-18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh F&O universe
        run: python scripts/refresh_fno.py

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data/market.db
          key: price-db-v2-${{ github.run_id }}
          restore-keys: |
            price-db-v2-

      - name: Backfill history on first run
        run: |
          if [ ! -f data/market.db ]; then
            echo "No cached price DB — running initial ~1yr backfill"
            python scripts/backfill.py --days 220
          fi

      - name: Run daily scan
        id: scan
        env:
          PROFILE: ${{ vars.PROFILE || 'tight' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run_daily.py --wait
          else
            python run_daily.py
          fi

      - name: Write run summary
        if: steps.scan.outputs.changed == 'true'
        run: python scripts/summarize.py >> "$GITHUB_STEP_SUMMARY"

      - name: Save price history
        if: steps.scan.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/market.db
          key: price-db-v2-${{ github.run_id }}

      - name: Commit signal snapshot
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/daily_signals.json output/daily_signals.csv config/fno_stocks.json
          git diff --cached --quiet || git commit -m "chore: daily signals $(date -u +%F)"
          git push
