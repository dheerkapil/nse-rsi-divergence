services:
  - type: web
    name: nse-rsi-divergence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir web app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PROFILE
        value: tight
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
