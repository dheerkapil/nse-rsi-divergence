<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#1a73e8">
    <title>🔐 Login — RSI Divergence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg:#f8f9fa; --surface:#fff; --surface-2:#f1f3f4; --text:#202124;
            --text-muted:#5f6368; --border:#dadce0; --primary:#1a73e8; --primary-fill:#1a73e8;
            --primary-text:#fff; --danger:#d93025; --input-bg:#fff;
            --shadow-2:0 1px 3px rgba(60,64,67,.15),0 4px 8px 3px rgba(60,64,67,.08);
        }
        body.dark {
            --bg:#000; --surface:#121212; --surface-2:#1e1e1e; --text:#e8eaed;
            --text-muted:#b0b4b8; --border:#3c4043; --primary:#8ab4f8; --primary-fill:#8ab4f8;
            --primary-text:#202124; --danger:#f28b82; --input-bg:#1e1e1e;
            --shadow-2:0 4px 8px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.5);
        }
        * { box-sizing: border-box; }
        html { background-color: var(--bg) !important; min-height:100vh; }
        body {
            font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
            background-color:var(--bg) !important; color:var(--text); margin:0; min-height:100vh;
            display:flex; align-items:center; justify-content:center; padding:20px;
            transition:background .2s ease,color .2s ease;
        }
        .login-card {
            background:var(--surface); border-radius:20px; padding:32px 24px; max-width:420px;
            width:100%; box-shadow:var(--shadow-2); border:1px solid var(--border);
        }
        .login-card h1 { font-size:1.35rem; font-weight:500; margin:0 0 6px; text-align:center; }
        .subtitle { font-size:.85rem; color:var(--text-muted); text-align:center; margin:0 0 22px; }
        .form-label { font-size:.75rem; font-weight:500; color:var(--text-muted);
            letter-spacing:.4px; margin-bottom:6px; text-transform:uppercase; display:block; }
        .form-control {
            font-size:1rem; padding:.65rem .9rem; background:var(--input-bg); color:var(--text);
            border:1px solid var(--border); border-radius:12px; width:100%;
        }
        .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,115,232,.15); outline:none; }
        .btn-login {
            width:100%; font-size:.9rem; padding:.65rem 1rem; border-radius:20px; font-weight:500;
            border:none; background:var(--primary-fill); color:var(--primary-text); cursor:pointer;
            box-shadow:var(--shadow-2);
        }
        .btn-login:hover { filter:brightness(1.05); }
        .status-msg { font-size:.82rem; color:var(--danger); text-align:center; margin-top:12px; min-height:18px; }
        .theme-toggle {
            position:fixed; top:18px; right:18px; width:44px; height:44px; border-radius:50%;
            border:none; background:var(--surface-2); color:var(--text); font-size:1.2rem; cursor:pointer;
            box-shadow:var(--shadow-2);
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌙</button>
    <div class="login-card">
        <h1>🔐 RSI Divergence</h1>
        <p class="subtitle">Buy-signal screener — sign in to continue</p>
        <form method="post">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="••••••••" autocomplete="current-password" autofocus>
            <div class="status-msg">{{ error or '' }}</div>
            <button type="submit" class="btn-login" style="margin-top:14px;">Sign in</button>
        </form>
    </div>
    <script>
        const root = document.body, toggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') root.classList.add('dark');
        toggle.textContent = root.classList.contains('dark') ? '☀️' : '🌙';
        toggle.onclick = () => {
            root.classList.toggle('dark');
            localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
            toggle.textContent = root.classList.contains('dark') ? '☀️' : '🌙';
        };
    </script>
</body>
</html>
